services:
  backend:
    build:
      context: ./backend
    container_name: drm-backend
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - drm-data:/data
      - /proc/sys:/host/proc/sys
    environment:
      PORT: "8081"
      DOCKER_SOCKET: /var/run/docker.sock
      DRM_DATA_DIR: /data
      DRM_NETWORK_POLICY_INTERVAL_MS: "5000"
      DRM_FIREWALL_DYNAMIC_INTERVAL_MS: "5000"
      DRM_NAT_DYNAMIC_INTERVAL_MS: "5000"
      DRM_INTERFACE_ROLLBACK_MS: "60000"
      HOST_PROC_SYS: /host/proc/sys
      COOKIE_SECURE: "false"
      SESSION_TTL_MS: "86400000"
      SESSION_TOUCH_INTERVAL_MS: "300000"
      GITHUB_REPOSITORY: "RyVolodya/docker-router-manager"
      GITHUB_UPDATE_CACHE_MS: "900000"

  frontend:
    build:
      context: ./frontend
    container_name: drm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  drm-data:
